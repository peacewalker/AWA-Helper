name: Build Fly image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/fly/Dockerfile
      - deploy/fly/start.sh
      - deploy/fly/.dockerignore
      - .github/workflows/fly-image.yml
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: fly-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/awa-helper-fly" >> "$GITHUB_ENV"

      - name: Check startup script
        run: sh -n deploy/fly/start.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build latest official image with Fly startup
        uses: docker/build-push-action@v6
        with:
          context: deploy/fly
          file: deploy/fly/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: ${{ env.IMAGE }}:latest

      - name: Verify image files and runtime user
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE:latest" -ec '
            test -s /usr/src/app/output/index.js
            sh -n /start.sh
            test "$(su-exec node:node id -un)" = node
            su-exec node:node node --version
          '

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: docker push "$IMAGE:latest"

      - name: Write result
        run: |
          {
            printf 'Published: `%s:latest`\n' "$IMAGE"
            echo ""
            echo 'Fly update command: `fly deploy --ha=false`'
            echo ""
            echo "For the first publish, set the GHCR package visibility to Public."
          } >> "$GITHUB_STEP_SUMMARY"
